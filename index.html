<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
  :root{
    --bg: #0B1220;
    --surface: #121B2E;
    --surface-2: #182338;
    --border: rgba(201,162,39,0.16);
    --border-strong: rgba(255,255,255,0.14);
    --gold: #C9A227;
    --gold-soft: rgba(201,162,39,0.14);
    --text: #EDEFF3;
    --text-dim: #97A1B3;
    --text-faint: #5C6577;
    --ok: #34A870;
    --ok-soft: rgba(52,168,112,0.14);
    --bad: #D9584F;
    --bad-soft: rgba(217,88,79,0.14);
    --warn: #D9A441;
    --warn-soft: rgba(217,164,65,0.14);
  }
  *{box-sizing:border-box;}
  svg{width:16px;height:16px;flex-shrink:0;}
  html,body{margin:0;padding:0;background:#05070C;font-family:'Cairo',sans-serif;color:var(--text);}
  body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:28px 12px;}

  .phone{
    width:100%;max-width:380px;
    background:var(--bg);
    border-radius:32px;
    border:1px solid var(--border-strong);
    box-shadow: 0 30px 60px rgba(0,0,0,0.45);
    overflow:hidden;
    height:min(700px, 88vh);
    display:flex;flex-direction:column;
    position:relative;
  }

  /* ---- Onboarding & shift select ---- */
  .center-screen{
    flex:1;display:flex;flex-direction:column;justify-content:center;
    padding:32px 26px;gap:18px;
  }
  .brand-mark{
    width:52px;height:52px;border-radius:14px;
    background:var(--gold-soft);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    color:var(--gold);
  }
  .logo-img{width:92px;height:92px;object-fit:contain;align-self:center;}
  .powered-by{text-align:center;font-size:10.5px;color:var(--text-faint);letter-spacing:0.4px;margin-top:6px;}
  .install-banner{
    background:var(--gold-soft);border-bottom:1px solid var(--gold);
    padding:12px 14px;display:flex;align-items:flex-start;gap:10px;
  }
  .install-text{font-size:11.5px;color:var(--text);line-height:1.7;flex:1;}
  .install-close{background:none;border:none;color:var(--text-dim);font-size:14px;cursor:pointer;padding:2px 4px;}
  .headline{font-size:21px;font-weight:700;margin:0;}
  .sub{font-size:13.5px;color:var(--text-dim);margin:0;line-height:1.7;}
  .field-label{font-size:12.5px;color:var(--text-dim);margin-bottom:6px;display:block;}
  .id-error{font-size:11.5px;color:var(--bad);margin-top:7px;}
  input[type=text]{
    width:100%;background:var(--surface);border:1px solid var(--border-strong);
    border-radius:12px;padding:13px 14px;color:var(--text);font-family:inherit;
    font-size:14.5px;outline:none;
  }
  input[type=text]:focus{border-color:var(--gold);}
  .btn-primary{
    width:100%;background:var(--gold);color:#1B1404;border:none;
    border-radius:12px;padding:14px;font-family:inherit;font-weight:700;
    font-size:14.5px;cursor:pointer;letter-spacing:0.2px;
  }
  .btn-primary:disabled{opacity:0.35;cursor:not-allowed;}
  .btn-primary:active{transform:scale(0.98);}

  .shift-card{
    display:flex;align-items:center;gap:13px;
    background:var(--surface);border:1px solid var(--border-strong);
    border-radius:14px;padding:15px 16px;cursor:pointer;
    text-align:right;width:100%;font-family:inherit;color:var(--text);
  }
  .shift-card:active{border-color:var(--gold);background:var(--surface-2);}
  .shift-icon{
    width:38px;height:38px;border-radius:10px;background:var(--gold-soft);
    display:flex;align-items:center;justify-content:center;color:var(--gold);flex-shrink:0;
  }
  .shift-name{font-size:14.5px;font-weight:700;}
  .shift-time{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .shift-card.shift-locked{opacity:0.45;cursor:not-allowed;}
  .shift-card.shift-locked:active{border-color:var(--border-strong);background:var(--surface);}
  .shift-locked-note{font-size:10.5px;color:var(--bad);margin-top:4px;}

  /* ---- App shell ---- */
  .app-header{
    background:linear-gradient(180deg, var(--surface-2), var(--surface));
    border-bottom:1px solid var(--border);
    padding:16px 18px 14px;
  }
  .app-header .meta{font-size:11px;color:var(--text-dim);display:flex;justify-content:space-between;align-items:center;}
  .app-header .title{font-size:16.5px;font-weight:700;margin-top:3px;}
  .title-row{display:flex;align-items:center;justify-content:space-between;}
  .add-header-btn{background:var(--gold-soft);border:1px solid var(--border);border-radius:9px;}
  .add-header-btn svg{color:var(--gold);}
  .reset-link{background:none;border:none;color:var(--text-faint);font-size:10.5px;font-family:inherit;cursor:pointer;text-decoration:underline;}

  .app-body{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;}

  /* Deck tab */
  .deck-wrap{flex:1;display:flex;flex-direction:column;padding:16px 16px 6px;min-height:0;}
  .deck-progress{font-size:12px;color:var(--text-dim);text-align:center;margin-bottom:10px;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .undo-link{display:flex;align-items:center;gap:5px;background:var(--gold-soft);color:var(--gold);border:1px solid var(--border);border-radius:8px;padding:5px 12px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;}
  .deck-stage{position:relative;flex:1;min-height:230px;}
  .card{
    position:absolute;inset:0;background:var(--surface);border:1px solid var(--border-strong);
    border-radius:20px;padding:30px 20px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    touch-action:none;user-select:none;cursor:grab;
  }
  .card .id-label{font-size:11px;color:var(--text-faint);margin-bottom:6px;}
  .card .id-value{font-size:27px;font-weight:800;letter-spacing:0.5px;}
  .card .desc{font-size:13px;color:var(--text-dim);margin-top:9px;}
  .pieces-chip{margin-top:10px;font-size:11.5px;font-weight:700;color:var(--gold);background:var(--gold-soft);border:1px solid var(--border);border-radius:8px;padding:4px 12px;}
  .contents-box{margin-top:10px;width:100%;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:11px;padding:9px 12px;font-size:12px;color:var(--text-dim);text-align:right;line-height:1.7;}
  .contents-box span{display:block;font-size:10.5px;color:var(--text-faint);margin-bottom:3px;font-weight:700;}
  .stamp{
    position:absolute;top:20px;font-size:12px;font-weight:800;
    border:2px solid; border-radius:8px;padding:4px 10px;opacity:0;
  }
  .stamp.ok{right:16px;color:var(--ok);border-color:var(--ok);}
  .stamp.bad{left:16px;color:var(--bad);border-color:var(--bad);}
  .empty-deck{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-dim);text-align:center;padding:20px;}
  .empty-deck .big{font-size:15px;font-weight:700;color:var(--text);}
  .hint-row{display:flex;justify-content:space-between;font-size:11px;color:var(--text-faint);padding:12px 6px 4px;}
  .tap-buttons{display:flex;gap:10px;padding:6px 16px 4px;}
  .tap-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:12px;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;border:1px solid;}
  .tap-btn svg{width:16px;height:16px;}
  .tap-btn.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok);}
  .tap-btn.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad);}
  .deliver-btn{
    margin:10px 16px 16px;background:var(--warn-soft);color:var(--warn);border:1px solid var(--border);
    border-radius:12px;padding:13px;font-family:inherit;font-weight:700;font-size:13.5px;
    display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  }
  .deliver-btn.compact{
    width:fit-content;margin:8px auto 14px;padding:9px 18px;font-size:12px;border-radius:10px;
  }
  .deliver-btn.compact svg{width:14px;height:14px;}

  /* Lists */
  .list-scroll{flex:1;overflow-y:auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:9px;}
  .row-card{background:var(--surface);border:1px solid var(--border-strong);border-radius:13px;padding:12px 14px;}
  .row-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .row-id{font-size:13.5px;font-weight:700;}
  .row-desc{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .badge{font-size:10.5px;padding:3px 9px;border-radius:7px;font-weight:700;white-space:nowrap;}
  .badge.delivered{background:var(--warn-soft);color:var(--warn);}
  .row-detail{font-size:11px;color:var(--text-faint);margin-top:8px;line-height:1.9;border-top:1px dashed var(--border-strong);padding-top:8px;}
  .row-detail b{color:var(--text-dim);font-weight:600;}
  .empty-list{text-align:center;color:var(--text-faint);font-size:13px;padding:40px 20px;}

  /* Quick deliver */
  .search-wrap{padding:14px 16px 6px;}
  .search-box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;padding:11px 13px;}
  .search-box input{background:transparent;border:none;color:var(--text);font-family:inherit;font-size:13.5px;flex:1;outline:none;}
  .result-card{margin:0 16px 12px;background:var(--surface);border:1px solid var(--gold);border-radius:16px;padding:16px;}
  .result-head{display:flex;justify-content:space-between;align-items:center;}
  .result-id{font-size:16.5px;font-weight:800;}
  .result-desc{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .status-chip{font-size:10.5px;padding:3px 9px;border-radius:7px;font-weight:700;background:var(--ok-soft);color:var(--ok);}
  .form-stack{margin-top:13px;display:flex;flex-direction:column;gap:8px;}
  .form-stack input{padding:10px 11px;font-size:13px;}
  .confirm-btn{margin-top:12px;width:100%;background:var(--gold);color:#1B1404;border:none;border-radius:11px;padding:12px;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}
  .auto-note{font-size:10.5px;color:var(--text-faint);text-align:center;margin-top:9px;}
  .match-row{margin:0 16px 8px;padding:11px 13px;background:var(--surface);border:1px solid var(--border-strong);border-radius:11px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .match-row:active{border-color:var(--gold);}

  /* Bottom nav */
  .bottom-nav{display:flex;border-top:1px solid var(--border);background:var(--surface-2);}
  .nav-btn{flex:1;border:none;background:none;padding:11px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-faint);font-family:inherit;font-size:10.5px;cursor:pointer;}
  .nav-btn.active{color:var(--gold);}
  .nav-btn svg{width:19px;height:19px;}

  .toast{
    position:absolute;bottom:78px;left:50%;transform:translateX(-50%);
    background:#1B2436;border:1px solid var(--gold);color:var(--text);
    font-size:12.5px;padding:9px 16px;border-radius:10px;
    opacity:0;pointer-events:none;transition:opacity .25s, bottom .25s;
    white-space:nowrap;
  }
  .toast.show{opacity:1;bottom:90px;}

  .icon-btn{background:none;border:none;color:var(--text-faint);cursor:pointer;padding:4px;}
  .icon-btn svg{width:18px;height:18px;display:block;}
</style>
</head>

async function loadDoc(name){
  try{
    const snap = await DOC(name).get();
    if(snap.exists) return snap.data().payload;
  }catch(e){ console.error("Firestore load error:", name, e); }
  return null;
}
async function saveDoc(name, data){
  try{ await DOC(name).set({ payload: data, updatedAt: Date.now() }); }
  catch(e){ console.error("Firestore save error:", name, e); }
}

async function loadItems(){ return loadDoc("items"); }
async function saveItems(items){ return saveDoc("items", items); }
async function loadDeletedLog(){ return loadDoc("deletedLog"); }
async function saveDeletedLog(log){ return saveDoc("deletedLog", log); }

}

// مزامنة لحظية: أي تغيير من جهاز موظف ثاني ينعكس هنا تلقائياً بدون تحديث الصفحة
function listenLive(){
  DOC("items").onSnapshot(snap=>{
    if(!snap.exists) return;
    const remote = snap.data().payload;
    if(JSON.stringify(remote) !== JSON.stringify(state.items)){
      state.items = remote;
      if(state.view !== "onboarding") render();
    }
  });
}

async function init(){
  const saved = await loadItems();
  state.items = saved || JSON.parse(JSON.stringify(SEED_ITEMS));
  if(!saved) await saveItems(state.items);
  const savedEmp = await loadEmployees();
  state.employees = savedEmp || JSON.parse(JSON.stringify(SEED_EMPLOYEES));
  if(!savedEmp) await saveEmployees(state.employees);
  state.deletedLog = (await loadDeletedLog()) || [];
  state.shiftHistory = (await loadShiftHistory()) || [];
  listenLive();
  render();
}

async function persist(){
  await saveItems(state.items);
}
async function persistDeletedLog(){
  await saveDeletedLog(state.deletedLog);
}
async function persistShiftHistory(){
  await saveShiftHistory(state.shiftHistory);
}

function showToast(msg){
  const t = document.getElementById("toast");
  if(!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=> t.classList.remove("show"), 1800);
}

function setupSwipe(item){
  const card = document.getElementById("theCard");
  const stampOk = document.getElementById("stampOk");
  const stampBad = document.getElementById("stampBad");
  let startX = 0, dx = 0, dragging = false;

  card.addEventListener("pointerdown", e=>{
    dragging = true; startX = e.clientX;
    card.setPointerCapture(e.pointerId);
    card.style.transition = "none";
  });
  card.addEventListener("pointermove", e=>{
    if(!dragging) return;
    dx = e.clientX - startX;
    card.style.transform = `translateX(${dx}px) rotate(${dx/20}deg)`;
    const p = Math.min(Math.abs(dx)/90, 1);
    if(dx > 0){ stampOk.style.opacity = p; stampBad.style.opacity = 0; }
    else{ stampBad.style.opacity = p; stampOk.style.opacity = 0; }
  });
  function endDrag(e){
    if(!dragging) return;
    dragging = false;
    card.style.transition = "transform .28s ease";
    if(dx > 90){ finishCard("صح", 1); }
    else if(dx < -90){ finishCard("غلط", -1); }
    else{
      card.style.transform = "translateX(0) rotate(0)";
      stampOk.style.opacity = 0; stampBad.style.opacity = 0;
    }
    dx = 0;
  }
  card.addEventListener("pointerup", endDrag);
  card.addEventListener("pointercancel", endDrag);

  function finishCard(result, dir){
    card.style.transform = `translateX(${dir*500}px) rotate(${dir*25}deg)`;
    stampOk.style.opacity = 0; stampBad.style.opacity = 0;
    setTimeout(()=>{ markItem(item, result); }, 220);
  }
}

function markItem(item, result){
  const target = state.items.find(i => i.id === item.id);
  state.actionHistory.push({ itemId: target.id, prevLastCheck: target.lastCheck ? {...target.lastCheck} : null });
  if(state.actionHistory.length > 30) state.actionHistory.shift();
  target.lastCheck = { result, by: state.employee, time: fmtTime(new Date()), shiftKey: state.shift.key };
  persist();
  showToast(result === "صح" ? `${item.id} — تم تأكيده صح` : `${item.id} — تم تعليمه غلط، للمتابعة`);
  renderMain();
}

function undoLastAction(){
  if(!state.actionHistory.length) return;
  const last = state.actionHistory.pop();
  const target = state.items.find(i => i.id === last.itemId);
  if(target) target.lastCheck = last.prevLastCheck;
  persist();
  showToast(`تم التراجع عن ${last.itemId}`);
  renderMain();
}

/* ---------- Shift complete / report ---------- */
function renderShiftComplete(body){
  const shiftKey = state.shift.key;
  const checked = state.items.filter(i => i.lastCheck && i.lastCheck.shiftKey === shiftKey && i.status !== "مسلّم" && i.status !== "متلف");
  const delivered = state.items.filter(i => i.deliveredShiftKey === shiftKey);
  const okCount = checked.filter(i=>i.lastCheck.result === "صح").length;
  const badCount = checked.filter(i=>i.lastCheck.result === "غلط").length;
  const now = new Date();

  const subject = `تقرير جرد المستودع - ${state.shift.name} - ${fmtDate(now)}`;
  const pad = (s, len) => { s = String(s); return s.length >= len ? s.slice(0,len) : s + " ".repeat(len - s.length); };
  let bodyText = `تقرير جرد المستودع\nالموظف: ${state.employee}\nالشفت: ${state.shift.name} (${state.shift.time})\nالتاريخ: ${fmtDate(now)}\n\n`;
  bodyText += `جدول الجرد:\n${pad("رقم الطرد",12)}${pad("الحالة",8)}${pad("الوقت",8)}الوصف\n`;
  bodyText += "-".repeat(45) + "\n";
  checked.forEach(i=>{ bodyText += `${pad(i.id,12)}${pad(i.lastCheck.result,8)}${pad(i.lastCheck.time,8)}${i.desc}\n`; });
  bodyText += `\nجدول التسليمات:\n${pad("رقم الطرد",12)}${pad("المستلم",14)}${pad("الوقت",16)}رقم الإذن\n`;
  bodyText += "-".repeat(55) + "\n";
  if(delivered.length === 0) bodyText += `لا يوجد\n`;
  delivered.forEach(i=>{ bodyText += `${pad(i.id,12)}${pad(i.recipient||"-",14)}${pad(i.deliveredAtLabel||"-",16)}${i.permit||"-"}\n`; });
  const mailtoHref = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyText)}`;

  body.innerHTML = `
    <div class="list-scroll" style="padding-top:18px;">
      <div class="empty-deck" style="padding:4px 6px 10px;">
        ${ICONS.check}
        <div class="big">شكراً ${escapeHtml(state.employee)}، تم إنهاء الجرد ✅</div>
        <div>${state.shift.name} &middot; ${fmtDate(now)}</div>
      </div>

      <div class="row-card">
        <div class="row-detail" style="border-top:none;padding-top:0;">
          <div><b>محجوزات صح:</b> ${okCount} &nbsp; &middot; &nbsp; <b>محجوزات غلط:</b> ${badCount} &nbsp; &middot; &nbsp; <b>تسليمات هالشفت:</b> ${delivered.length}</div>
        </div>
      </div>

      ${checked.length ? `
      <div class="row-card">
        <div class="row-id" style="margin-bottom:8px;">جدول الجرد</div>
        ${checked.map(i => `
          <div class="row-detail" style="border-top:1px dashed var(--border-strong);padding-top:8px;margin-top:8px;">
            <div><b>${i.id}</b> — ${escapeHtml(i.desc)}</div>
            <div>الحالة: ${i.lastCheck.result} &nbsp; &middot; &nbsp; الوقت: ${i.lastCheck.time}</div>
          </div>
        `).join("")}
      </div>` : ""}

      ${delivered.length ? `
      <div class="row-card">
        <div class="row-id" style="margin-bottom:8px;">جدول التسليمات</div>
        ${delivered.map(i => `
          <div class="row-detail" style="border-top:1px dashed var(--border-strong);padding-top:8px;margin-top:8px;">
            <div><b>${i.id}</b> — ${escapeHtml(i.desc)}</div>
            <div>المستلم: ${escapeHtml(i.recipient || "-")} &nbsp; &middot; &nbsp; الوقت: ${i.deliveredAtLabel || "-"}</div>
          </div>
        `).join("")}
      </div>` : ""}

      <a class="btn-primary" href="${mailtoHref}" id="emailReportBtn" style="margin-top:6px;text-decoration:none;display:block;text-align:center;">فتح التقرير بالإيميل</a>
      <button class="deliver-btn" id="copyReportBtn" style="margin-top:6px;background:var(--surface-1);color:var(--text-dim);border-color:var(--border-strong);">نسخ نص التقرير (لو ما فتح الإيميل)</button>
      <button class="deliver-btn" id="closeShiftBtn" style="margin-top:4px;">إغلاق الشفت</button>
    </div>
  `;

  document.getElementById("copyReportBtn").addEventListener("click", async ()=>{
    const fullText = `الموضوع: ${subject}\n\n${bodyText}`;
    try{
      await navigator.clipboard.writeText(fullText);
      showToast("تم نسخ التقرير — الصقه بأي إيميل");
    }catch(e){
      showToast("تعذر النسخ التلقائي، انسخه يدوياً");
    }
  });

  document.getElementById("closeShiftBtn").addEventListener("click", async ()=>{
    state.shiftHistory.push({
      shiftName: state.shift.name,
      date: fmtDate(now),
      employee: state.employee,
      closedAt: fmtTime(new Date()),
      okCount, badCount, deliveredCount: delivered.length,
      checkedList: checked.map(i=>({id:i.id, desc:i.desc, result:i.lastCheck.result, time:i.lastCheck.time})),
      deliveredList: delivered.map(i=>({id:i.id, desc:i.desc, recipient:i.recipient, permit:i.permit, time:i.deliveredAtLabel})),
    });
    await persistShiftHistory();
    state.actionHistory = [];
    showToast("تم إغلاق الشفت وحفظه بالسجل");
    setTimeout(()=>{
      state.shift = null;
      state.view = "shift";
      state.tab = "deck";
      render();
    }, 500);
  });
}


function renderDelivered(body){
  const list = state.items
    .filter(i => i.status === "مسلّم" || i.status === "متلف")
    .sort((a,b)=> new Date(b.deliveredAt) - new Date(a.deliveredAt));

  if(list.length === 0){
    body.innerHTML = `<div class="list-scroll"><div class="empty-list">ما فيه محجوزات مسلّمة أو متلفة بعد</div></div>`;
    return;
  }

  body.innerHTML = `<div class="list-scroll">
    ${list.map(i => `
      <div class="row-card">
        <div class="row-top">
          <div>
            <div class="row-id">${i.id}</div>
            <div class="row-desc">${escapeHtml(i.desc)}</div>
          </div>
          <span class="badge delivered">${i.status}</span>
        </div>
        <div class="row-detail">
          <div><b>سلّمه:</b> ${escapeHtml(i.deliveredBy || "-")} &nbsp; &middot; &nbsp; <b>الوقت:</b> ${i.deliveredAtLabel || "-"}</div>
          <div><b>استلمه:</b> ${escapeHtml(i.recipient || "-")} &nbsp; &middot; &nbsp; <b>رقم الإذن:</b> ${escapeHtml(i.permit || "-")}</div>
        </div>
      </div>
    `).join("")}
  </div>`;
}

/* ---------- Quick deliver tab ---------- */
function renderQuickDeliver(body){
  const pool = state.items.filter(i => i.status === "موجود");
  const selected = state.selectedForDelivery ? state.items.find(i=>i.id===state.selectedForDelivery) : null;

  body.innerHTML = `
    <div class="search-wrap">
      <div class="search-box">
        <input type="text" id="qSearch" placeholder="رقم الطرد..." value="${escapeAttr(state.search)}">
        <button class="icon-btn" id="qSearchBtn">${ICONS.search}</button>
      </div>
    </div>
    <div id="resultsZone" style="flex:1;overflow-y:auto;"></div>
  `;

  const input = document.getElementById("qSearch");
  const btn = document.getElementById("qSearchBtn");
  input.addEventListener("keydown", e=>{ if(e.key === "Enter") doSearch(); });
  btn.addEventListener("click", doSearch);

  function doSearch(){
    state.search = input.value;
    state.selectedForDelivery = null;
    renderResults();
  }

  renderResults();

  function renderResults(){
    const zone = document.getElementById("resultsZone");
    const qq = state.search.trim();
    const sel = state.selectedForDelivery ? state.items.find(i=>i.id===state.selectedForDelivery) : null;

    if(sel) return renderDeliverForm(zone, sel);

    if(!qq){
      zone.innerHTML = `<div class="empty-list">اكتب رقم الطرد واضغط بحث</div>`;
      return;
    }
    const found = pool.find(i => i.id.toLowerCase() === qq.toLowerCase())
      || pool.find(i => i.id.toLowerCase().includes(qq.toLowerCase()) || i.desc.includes(qq));

    if(!found){
      zone.innerHTML = `<div class="empty-list">ما فيه نتائج مطابقة</div>`;
      return;
    }
    state.selectedForDelivery = found.id;
    renderDeliverForm(zone, found);
  }

  function renderDeliverForm(zone, sel){
    zone.innerHTML = `
      <div class="result-card">
        <div class="result-head">
          <div>
            <div class="result-id">${sel.id}</div>
            <div class="result-desc">${escapeHtml(sel.desc)}</div>
          </div>
          <span class="status-chip">موجود</span>
        </div>
        <div class="pieces-chip" style="margin-top:9px;">عدد الطرود: ${sel.pieces ?? 1}</div>
        ${sel.contents ? `<div class="contents-box">${escapeHtml(sel.contents)}</div>` : ""}
        <div class="form-stack">
          <input type="text" id="recipientInput" placeholder="اسم المستلم">
          <input type="text" id="permitInput" placeholder="رقم إذن الصرف">
        </div>
        <button class="confirm-btn" id="confirmDeliver">${ICONS.truck}تأكيد التسليم</button>
        <div class="auto-note">يُسجَّل تلقائياً باسمك (${escapeHtml(state.employee)}) ووقتك الحالي ضمن ${state.shift.name}</div>
      </div>
    `;
    document.getElementById("confirmDeliver").addEventListener("click", async ()=>{
      const recipient = document.getElementById("recipientInput").value.trim();
      const permit = document.getElementById("permitInput").value.trim();
      const now = new Date();
      sel.status = "مسلّم";
      sel.deliveredBy = state.employee;
      sel.deliveredAt = now.toISOString();
      sel.deliveredAtLabel = `${fmtDate(now)} ${fmtTime(now)}`;
      sel.deliveredShiftKey = state.shift.key;
      sel.recipient = recipient || "-";
      sel.permit = permit || "-";
      await persist();
      state.search = "";
      state.selectedForDelivery = null;
      showToast(`تم تسليم ${sel.id}`);
      renderMain();
    });
  }
}

/* ---------- Shift history screen ---------- */
function renderHistoryScreen(){
  const list = state.shiftHistory.slice().reverse();
  phone.innerHTML = `
    <div class="app-header">
      <div class="meta">
        <span>سجل الشفتات السابقة</span>
        <button class="reset-link" id="backFromHistory">رجوع</button>
      </div>
      <div class="title">${list.length} شفت مقفول</div>
    </div>
    <div class="list-scroll" style="flex:1;">
      ${list.length === 0 ? `<div class="empty-list">ما فيه شفتات مقفولة بعد</div>` : list.map((h, idx) => `
        <div class="row-card">
          <div class="row-top">
            <div>
              <div class="row-id">${h.shiftName} &middot; ${h.date}</div>
              <div class="row-desc">${escapeHtml(h.employee)} &middot; أُقفل الساعة ${h.closedAt}</div>
            </div>
          </div>
          <div class="row-detail">
            <div><b>صح:</b> ${h.okCount} &nbsp; &middot; &nbsp; <b>غلط:</b> ${h.badCount} &nbsp; &middot; &nbsp; <b>تسليمات:</b> ${h.deliveredCount}</div>
          </div>
          <button class="reset-link" data-idx="${idx}" style="margin-top:8px;">عرض التفاصيل</button>
          <div class="history-detail" id="hist-detail-${idx}" style="display:none;margin-top:8px;"></div>
        </div>
      `).join("")}
    </div>
  `;
  document.getElementById("backFromHistory").addEventListener("click", ()=>{
    state.view = "shift";
    render();
  });
  phone.querySelectorAll("[data-idx]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = btn.dataset.idx;
      const box = document.getElementById(`hist-detail-${idx}`);
      const h = list[idx];
      if(box.style.display === "none"){
        box.style.display = "block";
        box.innerHTML = `
          ${h.checkedList.length ? `<div class="row-detail"><b>جدول الجرد:</b><br>${h.checkedList.map(i=>`${i.id} — ${escapeHtml(i.desc)} — ${i.result} — ${i.time}`).join("<br>")}</div>` : ""}
          ${h.deliveredList.length ? `<div class="row-detail" style="margin-top:6px;"><b>جدول التسليمات:</b><br>${h.deliveredList.map(i=>`${i.id} — المستلم: ${escapeHtml(i.recipient||"-")} — ${i.time}`).join("<br>")}</div>` : ""}
        `;
        btn.textContent = "إخفاء التفاصيل";
      }else{
        box.style.display = "none";
        btn.textContent = "عرض التفاصيل";
      }
    });
  });
}

/* ---------- Manage tab: add / delete ---------- */
function renderManage(body){
  const items = state.items;
  const target = state.deleteTarget ? items.find(i=>i.id===state.deleteTarget) : null;
  const isAdmin = ADMIN_IDS.includes(state.employeeId);
  const empTarget = state.empDeleteTarget ? state.employees.find(e=>e.id===state.empDeleteTarget) : null;

  body.innerHTML = `
    <div class="list-scroll" style="padding-top:12px;">

      ${state.addFormOpen ? `
      <div class="result-card">
        <div class="row-id" style="margin-bottom:4px;">إضافة محجوزة جديدة</div>
        <div class="form-stack">
          <input type="text" id="newId" placeholder="رقم الطرد / رقم الوصل">
          <input type="text" id="newDesc" placeholder="الوصف / المحتويات">
          <input type="text" id="newPieces" placeholder="عدد الطرود (مثال: 1)">
        </div>
        <button class="confirm-btn" id="saveNewItem">${ICONS.plus}إضافة للقائمة</button>
      </div>
      ` : `
      <button class="btn-primary" id="openAddForm" style="display:flex;align-items:center;justify-content:center;gap:7px;">${ICONS.plus}إضافة محجوزة جديدة</button>
      `}

      ${target ? `
      <div class="result-card" style="border-color:var(--bad);">
        <div class="row-id" style="margin-bottom:2px;">حذف ${target.id}</div>
        <div class="row-desc" style="margin-bottom:10px;">${escapeHtml(target.desc)}</div>
        <div class="field-label" style="margin-bottom:6px;">سبب الحذف (مطلوب)</div>
        <input type="text" id="deleteReason" placeholder="مثال: تكرار بالإدخال، خطأ تسجيل...">
        <button class="confirm-btn" id="confirmDelete" style="background:var(--bad);color:#fff;margin-top:10px;">${ICONS.trash}تأكيد الحذف</button>
        <button class="deliver-btn" id="cancelDelete" style="margin-top:8px;background:var(--surface-1);color:var(--text-dim);">إلغاء</button>
      </div>
      ` : ""}

      <div class="row-id" style="padding:4px 2px;">كل المحجوزات (${items.length})</div>
      ${items.map(i => `
        <div class="row-card">
          <div class="row-top">
            <div>
              <div class="row-id">${i.id}</div>
              <div class="row-desc">${escapeHtml(i.desc)} &middot; عدد: ${i.pieces ?? 1}</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="badge delivered" style="background:${i.status==='موجود' ? 'var(--ok-soft)' : 'var(--warn-soft)'};color:${i.status==='موجود' ? 'var(--ok)' : 'var(--warn)'};">${i.status}</span>
              <button class="icon-btn" data-del="${i.id}" style="color:var(--bad);">${ICONS.trash}</button>
            </div>
          </div>
        </div>
      `).join("")}

      ${state.deletedLog.length ? `
        <div class="row-id" style="padding:14px 2px 4px;">سجل الحذف</div>
        ${state.deletedLog.slice().reverse().map(d => `
          <div class="row-card">
            <div class="row-detail" style="border-top:none;padding-top:0;">
              تم حذف <b>${d.id}</b> (${escapeHtml(d.desc)}) بواسطة الموظف (${escapeHtml(d.by)}) الساعة ${d.time} بتاريخ ${d.date} — السبب: ${escapeHtml(d.reason)}
            </div>
          </div>
        `).join("")}
      ` : ""}

      ${isAdmin ? `
      <div class="row-id" style="padding:16px 2px 4px;border-top:1px solid var(--border);margin-top:10px;">إدارة الموظفين (Admin) — ${state.employees.length}</div>

      ${state.empFormOpen ? `
      <div class="result-card">
        <div class="row-id" style="margin-bottom:4px;">إضافة موظف جديد</div>
        <div class="form-stack">
          <input type="text" id="newEmpId" inputmode="numeric" placeholder="الرقم الشخصي/المدني">
          <input type="text" id="newEmpName" placeholder="اسم الموظف">
        </div>
        <button class="confirm-btn" id="saveNewEmp">${ICONS.plus}إضافة الموظف</button>
      </div>
      ` : `
      <button class="btn-primary" id="openEmpForm" style="display:flex;align-items:center;justify-content:center;gap:7px;">${ICONS.plus}إضافة موظف جديد</button>
      `}

      ${empTarget ? `
      <div class="result-card" style="border-color:var(--bad);">
        <div class="row-id" style="margin-bottom:10px;">حذف الموظف: ${escapeHtml(empTarget.name)} (${empTarget.id})</div>
        <button class="confirm-btn" id="confirmEmpDelete" style="background:var(--bad);color:#fff;">${ICONS.trash}تأكيد حذف الموظف</button>
        <button class="deliver-btn" id="cancelEmpDelete" style="margin-top:8px;background:var(--surface-1);color:var(--text-dim);">إلغاء</button>
      </div>
      ` : ""}

      ${state.employees.map(e => `
        <div class="row-card">
          <div class="row-top">
            <div>
              <div class="row-id">${escapeHtml(e.name)}${ADMIN_IDS.includes(e.id) ? ' <span style="color:var(--gold);font-size:10px;">(Admin)</span>' : ""}</div>
              <div class="row-desc">الرقم: ${e.id}</div>
            </div>
            <button class="icon-btn" data-emp-del="${e.id}" style="color:var(--bad);">${ICONS.trash}</button>
          </div>
        </div>
      `).join("")}
      ` : ""}

    </div>
  `;

  const addBtn = document.getElementById("openAddForm");
  if(addBtn) addBtn.addEventListener("click", ()=>{ state.addFormOpen = true; state.deleteTarget = null; render(); });

  const saveBtn = document.getElementById("saveNewItem");
  if(saveBtn) saveBtn.addEventListener("click", async ()=>{
    const id = document.getElementById("newId").value.trim();
    const desc = document.getElementById("newDesc").value.trim();
    const pieces = parseInt(document.getElementById("newPieces").value.trim(), 10) || 1;
    if(!id){ showToast("لازم تكتب رقم الطرد"); return; }
    if(state.items.some(i=>i.id === id)){ showToast("رقم الطرد موجود مسبقاً"); return; }
    state.items.push({id, desc: desc || "-", contents: null, pieces, status: "موجود", lastCheck: null});
    await persist();
    state.addFormOpen = false;
    showToast(`تمت إضافة ${id}`);
    render();
  });

  phone.querySelectorAll("[data-del]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ state.deleteTarget = btn.dataset.del; state.addFormOpen = false; render(); });
  });

  const cancelBtn = document.getElementById("cancelDelete");
  if(cancelBtn) cancelBtn.addEventListener("click", ()=>{ state.deleteTarget = null; render(); });

  const confirmBtn = document.getElementById("confirmDelete");
  if(confirmBtn) confirmBtn.addEventListener("click", async ()=>{
    const reason = document.getElementById("deleteReason").value.trim();
    if(!reason){ showToast("لازم تذكر سبب الحذف"); return; }
    const now = new Date();
    state.deletedLog.push({
      id: target.id, desc: target.desc,
      by: state.employee, time: fmtTime(now), date: fmtDate(now),
      reason
    });
    state.items = state.items.filter(i => i.id !== target.id);
    await persist();
    await persistDeletedLog();
    state.deleteTarget = null;
    showToast(`تم حذف ${target.id}`);
    render();
  });

  const openEmpBtn = document.getElementById("openEmpForm");
  if(openEmpBtn) openEmpBtn.addEventListener("click", ()=>{ state.empFormOpen = true; state.empDeleteTarget = null; render(); });

  const saveEmpBtn = document.getElementById("saveNewEmp");
  if(saveEmpBtn) saveEmpBtn.addEventListener("click", async ()=>{
    const id = document.getElementById("newEmpId").value.trim();
    const name = document.getElementById("newEmpName").value.trim();
    if(!id || !name){ showToast("لازم تكتب الرقم والاسم"); return; }
    if(state.employees.some(e=>e.id === id)){ showToast("هذا الرقم مسجل مسبقاً"); return; }
    state.employees.push({id, name});
    await persistEmployees();
    state.empFormOpen = false;
    showToast(`تمت إضافة ${name}`);
    render();
  });

  phone.querySelectorAll("[data-emp-del]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ state.empDeleteTarget = btn.dataset.empDel; state.empFormOpen = false; render(); });
  });

  const cancelEmpBtn = document.getElementById("cancelEmpDelete");
  if(cancelEmpBtn) cancelEmpBtn.addEventListener("click", ()=>{ state.empDeleteTarget = null; render(); });

  const confirmEmpBtn = document.getElementById("confirmEmpDelete");
  if(confirmEmpBtn) confirmEmpBtn.addEventListener("click", async ()=>{
    state.employees = state.employees.filter(e => e.id !== empTarget.id);
    await persistEmployees();
    state.empDeleteTarget = null;
    showToast(`تم حذف ${empTarget.name}`);
    render();
  });
}

/* ---------- Utils ---------- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }
